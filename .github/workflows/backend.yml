name: Backend checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fpiupdates
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: fpiupdates_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fpiupdates -d fpiupdates_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://fpiupdates:ci_only@localhost:5432/fpiupdates_test
      TEST_DATABASE_URL: postgresql://fpiupdates:ci_only@localhost:5432/fpiupdates_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
